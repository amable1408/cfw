name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    # Debian 13 rather than the ubuntu-latest image: its gcc is 14 (the default cc on
    # ubuntu-latest predates -std=c23) and it packages the dependency versions these modules
    # were audited against. Resolving a dependency is the environment's job, not the build's.
    container: debian:13
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain and system dependencies
        run: apt-get update && apt-get install -y build-essential libcglm-dev libpcre2-dev
      # `make test` alone proves nothing when the export carries no suite yet: TEST_BIN is
      # empty, libcfw.a is only a prerequisite of the test binaries, and the job passes without
      # compiling a file. Build the library explicitly first.
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Allocation-failure harness
        run: make test-oom
      - name: Unchecked-build suites (ERROR_CHECK_ENABLED compiled out)
        run: make test-unchecked
      - name: Sanitizer build (ASan/UBSan)
        run: |
          make clean
          make test CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -std=c23"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cglm mingw-w64-ucrt-x86_64-pcre2 make
      - name: Build (MinGW)
        run: make
      - name: Test (MinGW)
        run: make test
      - name: Unchecked-build suites (MinGW)
        run: make test-unchecked
